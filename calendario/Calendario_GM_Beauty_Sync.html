  --danger:#c96b6b;
  --radius:16px;
  --shadow:0 4px 18px rgba(93,49,132,.08);
  --font-display:'Cormorant Garamond', Georgia, serif;
  --font-body:'Manrope','Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

/* ---------- HEADER ---------- */
header.topbar{
  background:linear-gradient(135deg,var(--roxo-900),var(--roxo-700) 60%,var(--roxo-500));
  color:#fff; padding:28px 24px 22px; position:sticky; top:0; z-index:30;
  box-shadow:0 6px 24px rgba(61,35,89,.25);
}
.topbar-inner{max-width:1180px;margin:0 auto;}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
.brand .mark{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:.5px;}
.brand .sub{font-size:12.5px;opacity:.8;letter-spacing:1.5px;text-transform:uppercase;}
.tagline{font-size:13px;opacity:.75;margin:2px 0 18px;}

/* progress panel */
.progress-panel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);padding:16px 18px;backdrop-filter:blur(6px);}
.progress-stats{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:12px;}
.stat{min-width:78px;}
.stat .n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;}
.stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;opacity:.75;margin-top:3px;}
.progress-bar-track{height:10px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--lilas-300),#fff);border-radius:8px;transition:width .4s ease;}
.progress-pct{font-size:12px;opacity:.85;margin-top:6px;text-align:right;}

/* ---------- MONTH NAV ---------- */
.month-nav{max-width:1180px;margin:18px auto 0;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap;}
.month-btn{border:1px solid var(--line);background:#fff;color:var(--ink-soft);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
.month-btn.active{background:var(--roxo-700);color:#fff;border-color:var(--roxo-700);}
.month-btn.disabled{opacity:.4;cursor:not-allowed;}
.month-btn:not(.disabled):not(.active):hover{border-color:var(--roxo-500);color:var(--roxo-700);}

/* ---------- TOOLBAR ---------- */
.toolbar{max-width:1180px;margin:16px auto 0;padding:0 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.search-box{flex:1;min-width:220px;position:relative;}
.search-box input{width:100%;padding:10px 14px 10px 36px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-family:var(--font-body);background:#fff;}
.search-box::before{content:"⚲";position:absolute;left:12px;top:9px;color:var(--ink-soft);font-size:15px;}
select.filter, .chip-toggle{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink);font-family:var(--font-body);cursor:pointer;}
.chip-toggle.active{background:var(--roxo-700);color:#fff;border-color:var(--roxo-700);font-weight:700;}
.view-toggle{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;}
.view-toggle button{border:none;background:transparent;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.view-toggle button.active{background:var(--lilas-100);color:var(--roxo-700);}

/* ---------- GRID ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 24px 60px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:8px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:.15s transform ease, .15s box-shadow ease;display:flex;flex-direction:column;gap:8px;}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(93,49,132,.14);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;}
.card-date{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--roxo-700);line-height:1;}
.card-day{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;}
.status-pill{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.st-NAO_INICIADO{background:#fde3e3;color:#a83a3a;}
.st-EM_PRODUCAO{background:#fdf0d0;color:#93711b;}
.st-GRAVADO{background:#dbe8fb;color:#2c5f9c;}
.st-EM_EDICAO{background:#ecdcf9;color:#6b3699;}
.st-PRONTO{background:#dcf3e6;color:#2b7a51;}
.st-PUBLICADO{background:#d6f0da;color:#1f7a34;border:1px solid #8fd3a0;}
.card-quadro{font-size:12px;font-weight:700;color:var(--roxo-500);text-transform:uppercase;letter-spacing:.4px;}
.card-tema{font-size:14.5px;font-weight:600;line-height:1.3;}
.card-meta{font-size:12px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 10px;}
.card-meta span{display:flex;align-items:center;gap:4px;}
.card-gancho{font-size:12.5px;font-style:italic;color:var(--ink-soft);border-left:2px solid var(--lilas-300);padding-left:8px;}
.card-actions{margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:space-between;}
.fmt-badge{font-size:10.5px;padding:3px 8px;border-radius:6px;background:var(--lilas-100);color:var(--roxo-700);font-weight:700;}
.gravei-btn{font-size:11.5px;font-weight:700;border:1px solid var(--roxo-500);background:#fff;color:var(--roxo-700);padding:6px 10px;border-radius:9px;cursor:pointer;}
.gravei-btn.done{background:var(--roxo-700);color:#fff;}
.gravei-btn:disabled{opacity:.4;cursor:default;}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.empty-state .big{font-family:var(--font-display);font-size:22px;color:var(--roxo-700);margin-bottom:6px;}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(42,31,56,.55);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px;}
.overlay.open{display:flex;}
.modal{background:#fff;max-width:760px;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-bottom:40px;}
.modal-head{background:linear-gradient(135deg,var(--roxo-900),var(--roxo-700));color:#fff;padding:22px 26px;position:relative;}
.modal-head .close{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;}
.modal-head .m-quadro{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;opacity:.8;}
.modal-head .m-tema{font-family:var(--font-display);font-size:24px;font-weight:700;margin:4px 0;}
.modal-head .m-meta{font-size:12.5px;opacity:.85;display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
.modal-body{padding:22px 26px 30px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;}
.tab-btn{border:none;background:transparent;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--roxo-700);border-color:var(--roxo-700);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--roxo-500);font-weight:800;margin:16px 0 6px;}
.field{margin-bottom:10px;}
.field .k{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.field .v{font-size:14px;line-height:1.5;margin-top:2px;}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px;}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--lilas-100);color:var(--roxo-700);}
.scene-card, .story-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg);}
.scene-card .sc-head{font-weight:800;color:var(--roxo-700);font-size:12.5px;margin-bottom:4px;}
.checklist{display:flex;flex-direction:column;gap:6px;}
.check-item{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--bg);cursor:pointer;}
.check-item input{width:16px;height:16px;accent-color:var(--roxo-700);}
.check-item.done{text-decoration:line-through;color:var(--ink-soft);}
.gravei-big{width:100%;padding:12px;border-radius:12px;border:2px solid var(--roxo-700);background:#fff;color:var(--roxo-700);font-weight:800;font-size:14px;cursor:pointer;margin-bottom:14px;}
.gravei-big.done{background:var(--roxo-700);color:#fff;}
.caption-box{background:var(--bg);border:1px dashed var(--lilas-300);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}

/* recording mode */
.rec-group{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.rec-group h4{margin:0 0 8px;font-family:var(--font-display);font-size:18px;color:var(--roxo-700);}
.rec-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
.rec-item:first-of-type{border-top:none;}

footer{text-align:center;font-size:11.5px;color:var(--ink-soft);padding:20px;}
@media(max-width:640px){
  .brand .mark{font-size:24px;}
  .modal{border-radius:0;min-height:100vh;}
  .overlay{padding:0;}
}
</style>

<script>
// ============================================================
// GM Beauty — Calendário de Conteúdo — App
// ============================================================
const ALL_MONTHS = ["Agosto","Setembro","Outubro","Novembro","Dezembro"];
const STORAGE_KEY = "gmbeauty_calendario_v1";

let state = {
  month: null,
  search: "",
  quadro: "",
  formato: "",
  status: "",
  onlyVideosPending: false,
  view: "cards",
};

// ---------- sincronização em nuvem (Firebase) ----------
// 1) Vá em https://console.firebase.google.com/ e crie um projeto gratuito.
// 2) No menu do projeto, ative "Firestore Database" (modo produção).
// 3) Em "Configurações do projeto > Seus apps", crie um app Web (ícone </>) e copie o objeto de config.
// 4) Cole os valores abaixo, substituindo cada "COLOQUE_AQUI".
const firebaseConfig = {
  apiKey: "AIzaSyAjDrv_2BJbAVYoKgF7YzOFu9cz603NDKE",
  authDomain: "calendario-conteudosgm.firebaseapp.com",
  projectId: "calendario-conteudosgm",
  storageBucket: "calendario-conteudosgm.firebasestorage.app",
  messagingSenderId: "26688661602",
  appId: "1:26688661602:web:7626d2950b982199f1093b",
};

let db = null;
let syncDocRef = null;
let cloudReady = false;
let applyingRemoteUpdate = false;

function setSyncIndicator(text){
  const ind = document.getElementById("saveIndicator");
  if(ind) ind.textContent = text;
}

function initCloudSync(){
  try{
    if(!firebaseConfig.apiKey || firebaseConfig.apiKey === "COLOQUE_AQUI"){
      console.warn("Firebase não configurado — usando apenas armazenamento local neste aparelho.");
      setSyncIndicator("sincronização em nuvem não configurada");
      return;
    }
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    syncDocRef = db.collection("gmbeauty_calendario").doc("progresso");
    cloudReady = true;

    syncDocRef.onSnapshot((snap)=>{
      if(snap.metadata.hasPendingWrites) return; // ignora eco da própria escrita local
      if(!snap.exists) return;
      const data = snap.data() || {};
      STORE = data.store || {};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
      applyingRemoteUpdate = true;
      render();
      applyingRemoteUpdate = false;
      setSyncIndicator("sincronizado às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    }, (err)=>{
      console.error("Erro de sincronização:", err);
      setSyncIndicator("erro na sincronização — verifique sua internet");
    });
  }catch(e){
    console.error("Falha ao iniciar sincronização em nuvem:", e);
    setSyncIndicator("erro ao iniciar sincronização");
  }
}

// ---------- storage ----------
function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
let saveDebounceTimer = null;
function saveStore(store){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  setSyncIndicator("salvo às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));

  if(cloudReady && !applyingRemoteUpdate){
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(()=>{
      syncDocRef.set({ store: store, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
        .then(()=> setSyncIndicator("sincronizado às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})))
        .catch((err)=>{
          console.error("Erro ao enviar para a nuvem:", err);
          setSyncIndicator("não sincronizado — verifique sua internet");
        });
    }, 500);
  }
}
let STORE = loadStore(); // { [postId]: { checklist: {itemName:true}, } }

function getPostOverride(id){
  if(!STORE[id]) STORE[id] = { checklist: {} };
  return STORE[id];
}

// ---------- data access ----------
function getAllPosts(){
  let posts = [];
  ALL_MONTHS.forEach(m=>{
    const arr = (window.GM_MONTHS && window.GM_MONTHS[m]) || [];
    posts = posts.concat(arr);
  });
  return posts;
}
function getAvailableMonths(){
  return ALL_MONTHS.filter(m => window.GM_MONTHS && window.GM_MONTHS[m] && window.GM_MONTHS[m].length);
}

function isChecked(post, item){
  const ov = getPostOverride(post.id);
  return !!ov.checklist[item];
}
function toggleCheck(post, item){
  const ov = getPostOverride(post.id);
  ov.checklist[item] = !ov.checklist[item];
  saveStore(STORE);
}
function setCheck(post, item, val){
  const ov = getPostOverride(post.id);
  ov.checklist[item] = val;
  saveStore(STORE);
}

function computeStatus(post){
  const items = post.checklist.map(c=>c.item);
  const doneCount = items.filter(it=>isChecked(post,it)).length;
  const has = (name)=> items.includes(name) && isChecked(post,name);
  if(has("Publicado")) return "PUBLICADO";
  const relevant = items.filter(it=>it!=="Publicado");
  const allDone = relevant.every(it=>isChecked(post,it));
  if(allDone) return "PRONTO";
  if(post.video){
    if(has("Edição concluída")) return "EM_EDICAO";
    if(has("Gravação realizada")) return "GRAVADO";
  } else {
    if(has("Design realizado")) return "EM_EDICAO";
  }
  if(doneCount>0) return "EM_PRODUCAO";
  return "NAO_INICIADO";
}

const STATUS_LABEL = {
  NAO_INICIADO: "🔴 Não iniciado",
  EM_PRODUCAO: "🟡 Em produção",
  GRAVADO: "🔵 Gravado",
  EM_EDICAO: "🟣 Em edição",
  PRONTO: "🟢 Pronto",
  PUBLICADO: "✅ Publicado",
};

function isVideoPending(post){
  if(!post.video) return false;
  return !isChecked(post, "Gravação realizada");
}

// ---------- rendering: month nav ----------
function renderMonthNav(){
  const nav = document.getElementById("monthNav");
  nav.innerHTML = "";
  const available = getAvailableMonths();
  if(!state.month) state.month = available[0] || null;
  ALL_MONTHS.forEach(m=>{
    const btn = document.createElement("button");
    const has = available.includes(m);
    btn.className = "month-btn" + (m===state.month?" active":"") + (has?"":" disabled");
    btn.textContent = m.toUpperCase() + (has ? "" : " · em breve");
    if(has){
      btn.onclick = ()=>{ state.month = m; render(); };
    }
    nav.appendChild(btn);
  });
}

// ---------- toolbar setup ----------
function setupToolbar(){
  document.getElementById("searchInput").oninput = (e)=>{ state.search = e.target.value.toLowerCase(); renderMain(); };

  const quadros = ["Queridinhos da GM","Dica da GM","Por Dentro da GM","GM Testa","Resultado GM","Escolhas da Semana","Relacionamento"];
  const fq = document.getElementById("filterQuadro");
  fq.innerHTML = '<option value="">Todos os quadros</option>' + quadros.map(q=>`<option value="${q}">${q}</option>`).join("");
  fq.onchange = (e)=>{ state.quadro = e.target.value; renderMain(); };

  const formatos = ["Reel","Carrossel","Stories","Stories + Reel curto","TikTok"];
  const ff = document.getElementById("filterFormato");
  ff.innerHTML = '<option value="">Todos os formatos</option>' + formatos.map(q=>`<option value="${q}">${q}</option>`).join("");
  ff.onchange = (e)=>{ state.formato = e.target.value; renderMain(); };

  const fs = document.getElementById("filterStatus");
  fs.innerHTML = '<option value="">Todos os status</option>' + Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  fs.onchange = (e)=>{ state.status = e.target.value; renderMain(); };

  document.getElementById("filterVideos").onclick = (e)=>{
    state.onlyVideosPending = !state.onlyVideosPending;
    e.target.classList.toggle("active", state.onlyVideosPending);
    renderMain();
  };

  document.getElementById("viewCards").onclick = ()=>{ state.view="cards"; syncViewButtons(); renderMain(); };
  document.getElementById("viewRecording").onclick = ()=>{ state.view="recording"; syncViewButtons(); renderMain(); };

  document.getElementById("exportBtn").onclick = ()=>{
    const blob = new Blob([JSON.stringify(STORE, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `gmbeauty_progresso_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  document.getElementById("importInput").onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt)=>{
      try{
        const imported = JSON.parse(evt.target.result);
        STORE = Object.assign({}, STORE, imported); // mescla, não sobrescreve tudo
        saveStore(STORE);
        render();
        alert("Progresso importado com sucesso! " + Object.keys(imported).length + " conteúdos atualizados.");
      }catch(err){
        alert("Não foi possível ler esse arquivo de backup. Verifique se é o arquivo correto (.json exportado por este app).");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
}
function syncViewButtons(){
  document.getElementById("viewCards").classList.toggle("active", state.view==="cards");
  document.getElementById("viewRecording").classList.toggle("active", state.view==="recording");
}

// ---------- filtering ----------
function filteredPosts(){
  let posts = (window.GM_MONTHS[state.month] || []).slice();
  if(state.search){
    const s = state.search;
    posts = posts.filter(p =>
      (p.tema||"").toLowerCase().includes(s) ||
      (p.produto||"").toLowerCase().includes(s) ||
      (p.quadro||"").toLowerCase().includes(s) ||
      (p.date||"").toLowerCase().includes(s) ||
      (p.ganchoFinal||"").toLowerCase().includes(s)
    );
  }
  if(state.quadro) posts = posts.filter(p=>p.quadro===state.quadro);
  if(state.formato) posts = posts.filter(p=>p.formato===state.formato);
  if(state.status) posts = posts.filter(p=>computeStatus(p)===state.status);
  if(state.onlyVideosPending) posts = posts.filter(p=>isVideoPending(p));
  return posts;
}

// ---------- progress panel (global, all months) ----------
function renderProgress(){
  const all = getAllPosts();
  const total = all.length;
  let gravados=0, producao=0, prontos=0, publicados=0, naoIniciados=0;
  all.forEach(p=>{
    const st = computeStatus(p);
    if(st==="PUBLICADO") publicados++;
    else if(st==="PRONTO") prontos++;
    else if(st==="GRAVADO"||st==="EM_EDICAO") gravados++;
    else if(st==="EM_PRODUCAO") producao++;
    else naoIniciados++;
  });
  const doneWeight = publicados + prontos*0.8 + gravados*0.5 + producao*0.2;
  const pct = total ? Math.round((doneWeight/total)*100) : 0;

  const statsEl = document.getElementById("progressStats");
  statsEl.innerHTML = [
    ["Total de conteúdos", total],
    ["Gravados", gravados],
    ["Em produção", producao],
    ["Prontos", prontos],
    ["Publicados", publicados],
  ].map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("progressPct").textContent = `${pct}% da produção do período em andamento`;
}

// ---------- card rendering ----------
function cardHTML(p){
  const st = computeStatus(p);
  const pendingVideo = isVideoPending(p);
  return `
  <div class="card" data-id="${p.id}">
    <div class="card-top">
      <div><div class="card-date">${p.date}</div><div class="card-day">${p.day}</div></div>
      <div class="status-pill st-${st}">${STATUS_LABEL[st]}</div>
    </div>
    <div class="card-quadro">${p.quadro} <span style="float:right;color:var(--ok);font-weight:800;">★ ${p.notaGeral}/10</span></div>
    <div class="card-tema">${escapeHtml(p.tema)}</div>
    <div class="card-gancho">"${escapeHtml(p.ganchoFinal)}"</div>
    <div class="card-meta">
      <span>🎯 ${p.objetivo}</span>
      <span>🧴 ${escapeHtml(p.produto||"—")}</span>
    </div>
    <div class="card-actions">
      <span class="fmt-badge">${p.formato}</span>
      ${p.video ? `<button class="gravei-btn ${isChecked(p,"Gravação realizada")?"done":""}" data-gravei="${p.id}">${isChecked(p,"Gravação realizada")?"✔ Já gravei":"☐ Já gravei"}</button>` : ""}
    </div>
  </div>`;
}

function scoreLabel(k){
  const map = {atencao:"Atenção",relevancia:"Relevância",clareza:"Clareza",retencao:"Retenção",compartilhamento:"Compartilhamento",salvamento:"Salvamento",confianca:"Confiança",comercial:"Comercial",alinhamento:"Alinhamento",facilidade:"Facilidade"};
  return map[k]||k;
}
function escapeHtml(s){
  if(!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderCards(){
  const posts = filteredPosts();
  const main = document.getElementById("main");
  if(posts.length===0){
    main.innerHTML = `<div class="empty-state"><div class="big">Nenhum conteúdo encontrado</div>Ajuste os filtros ou a busca.</div>`;
    return;
  }
  main.innerHTML = `<div class="grid">${posts.map(cardHTML).join("")}</div>`;
  main.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click",(e)=>{
      if(e.target.closest("[data-gravei]")) return;
      openModal(el.dataset.id);
    });
  });
  main.querySelectorAll("[data-gravei]").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const id = btn.dataset.gravei;
      const post = getAllPosts().find(p=>p.id===id);
      setCheck(post,"Gravação realizada", !isChecked(post,"Gravação realizada"));
      render();
    });
  });
}

// ---------- recording mode ----------
function renderRecordingMode(){
  const main = document.getElementById("main");
  const posts = (window.GM_MONTHS[state.month]||[]).filter(p=>isVideoPending(p));
  if(posts.length===0){
    main.innerHTML = `<div class="empty-state"><div class="big">Nenhum vídeo pendente 🎉</div>Todos os vídeos deste mês já foram gravados.</div>`;
    return;
  }
  const groups = {};
  posts.forEach(p=>{
    const key = p.produto || "Sem produto definido";
    groups[key] = groups[key] || [];
    groups[key].push(p);
  });
  let html = `<div class="empty-state" style="padding:10px 0 20px;text-align:left;"><div class="big" style="text-align:left;">🎥 Dia de Gravação — ${state.month}</div>Conteúdos agrupados por produto para otimizar a sessão de gravação.</div>`;
  Object.entries(groups).forEach(([produto, items])=>{
    html += `<div class="rec-group"><h4>🧴 ${escapeHtml(produto)} <span style="font-size:12px;color:var(--ink-soft);font-weight:400;">(${items.length} conteúdo${items.length>1?"s":""})</span></h4>`;
    items.forEach(p=>{
      html += `<div class="rec-item">
        <div><b>${p.date}</b> · ${p.quadro} — ${escapeHtml(p.tema)}<br><span style="color:var(--ink-soft);font-size:12px;">"${escapeHtml(p.ganchoFinal)}"</span></div>
        <button class="gravei-btn" data-gravei="${p.id}">☐ Já gravei</button>
      </div>`;
    });
    html += `</div>`;
  });
  main.innerHTML = html;
  main.querySelectorAll("[data-gravei]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id = btn.dataset.gravei;
      const post = getAllPosts().find(p=>p.id===id);
      setCheck(post,"Gravação realizada", true);
      render();
    });
  });
}

function renderMain(){
  if(state.view==="recording") renderRecordingMode();
  else renderCards();
}

// ---------- modal ----------
function openModal(id){
  const post = getAllPosts().find(p=>p.id===id);
  if(!post) return;
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");
  modal.innerHTML = modalHTML(post);
  overlay.classList.add("open");

  modal.querySelector(".close").onclick = closeModal;

  // tabs
  modal.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick = ()=>{
      modal.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      modal.querySelectorAll(".tab-pane").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      modal.querySelector("#tab-"+btn.dataset.tab).classList.add("active");
    };
  });

  // checklist
  modal.querySelectorAll(".check-item input").forEach(inp=>{
    inp.onchange = ()=>{
      setCheck(post, inp.dataset.item, inp.checked);
      openModal(id); // re-render modal to update status header + gravei button
      renderMain();
      renderProgress();
    };
  });

  const graveiBig = modal.querySelector(".gravei-big");
  if(graveiBig){
    graveiBig.onclick = ()=>{
      setCheck(post,"Gravação realizada", !isChecked(post,"Gravação realizada"));
      openModal(id);
      renderMain();
      renderProgress();
    };
  }
}
function closeModal(){
  document.getElementById("overlay").classList.remove("open");
}
document.addEventListener("click",(e)=>{
  if(e.target.id==="overlay") closeModal();
});
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });

function modalHTML(post){
  const st = computeStatus(post);
  const roteiroHtml = post.video && post.roteiro ? post.roteiro.map(sc=>`
    <div class="scene-card">
      <div class="sc-head">${sc.cena} · ${sc.duracao} — ${sc.enquadramento}</div>
      <div><b>Ação:</b> ${escapeHtml(sc.acao)}</div>
      <div><b>Fala:</b> ${escapeHtml(sc.fala)}</div>
      ${sc.textoTela ? `<div><b>Texto na tela:</b> ${escapeHtml(sc.textoTela)}</div>` : ""}
    </div>`).join("") : "";

  const slidesHtml = post.slidesCarrossel ? post.slidesCarrossel.map((s,i)=>`
    <div class="scene-card"><div class="sc-head">${i===post.slidesCarrossel.length-1 ? "SLIDE FINAL (CTA)" : "SLIDE "+(i+1)}</div>${escapeHtml(s)}</div>`).join("") : "";

  const storiesHtml = (post.storiesSeq||[]).map(s=>`
    <div class="story-card"><div class="sc-head">Story ${s.n} · ${s.objetivo}</div>
    <div><b>Formato:</b> ${s.formato}</div><div><b>Texto/ação:</b> ${escapeHtml(s.texto)}</div></div>`).join("");

  const captionText = post.legenda ? `${post.legenda.gancho}\n\n${post.legenda.desenvolvimento}\n\n${post.legenda.beneficio}\n${post.legenda.produto}\n\n${post.legenda.cta}\n\nPalavras-chave: ${post.legenda.palavrasChave}\n${post.legenda.hashtags}` : "";

  const checklistHtml = post.checklist.map(c=>{
    const done = isChecked(post,c.item);
    return `<label class="check-item ${done?'done':''}"><input type="checkbox" data-item="${c.item}" ${done?"checked":""}> ${c.item}</label>`;
  }).join("");

  return `
  <div class="modal-head">
    <button class="close">✕</button>
    <div class="m-quadro">${post.quadro} · ${post.pilar}</div>
    <div class="m-tema">${escapeHtml(post.tema)}</div>
    <div class="m-meta">
      <span>📅 ${post.date} (${post.day})</span>
      <span>${STATUS_LABEL[st]}</span>
      <span>${post.formato}</span>
    </div>
  </div>
  <div class="modal-body">
    ${post.video ? `<button class="gravei-big ${isChecked(post,'Gravação realizada')?'done':''}">${isChecked(post,'Gravação realizada')?'✔ JÁ GRAVEI':'☐ JÁ GRAVEI'}</button>` : ""}
    <div class="tabs">
      <button class="tab-btn active" data-tab="estrategia">Estratégia</button>
      ${post.video ? `<button class="tab-btn" data-tab="roteiro">Roteiro</button>` : `<button class="tab-btn" data-tab="roteiro">Carrossel</button>`}
      <button class="tab-btn" data-tab="legenda">Legenda & CTA</button>
      <button class="tab-btn" data-tab="stories">Stories</button>
      <button class="tab-btn" data-tab="producao">Produção</button>
      <button class="tab-btn" data-tab="checklist">Checklist</button>
    </div>

    <div class="tab-pane active" id="tab-estrategia">
      <div class="field"><div class="k">Por que esse conteúdo existe</div><div class="v">${escapeHtml(post.porQueExiste)}</div></div>
      <div class="field"><div class="k">Objetivo</div><div class="v">${post.objetivo}</div></div>
      <div class="field"><div class="k">Etapa da jornada</div><div class="v">${post.etapa}</div></div>
      <div class="field"><div class="k">Público</div><div class="v">${post.publico}</div></div>
      <div class="field"><div class="k">Produto</div><div class="v">${escapeHtml(post.produto||"—")}</div></div>
      <div class="section-title">Gancho</div>
      <div class="field"><div class="k">Gancho original da planilha</div><div class="v">"${escapeHtml(post.ganchoOriginal)}"</div></div>
      <div class="badge-row"><span class="badge">${post.analiseGancho}</span></div>
      <div class="field"><div class="k">Análise</div><div class="v">${escapeHtml(post.analiseMotivo)}</div></div>
      <div class="field"><div class="k">Gancho final</div><div class="v"><b>"${escapeHtml(post.ganchoFinal)}"</b></div></div>
      <div class="section-title">Decisão</div>
      <div class="badge-row"><span class="badge">${post.decisao}</span><span class="badge">Nota geral: ${post.notaGeral}/10</span></div>
      ${post.scores ? `<div class="field"><div class="k">Análise por critério</div><div class="v" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">
        ${Object.entries(post.scores).map(([k,v])=>`<span class="badge" style="background:var(--bg);border:1px solid var(--line);">${scoreLabel(k)}: ${v}/10</span>`).join("")}
      </div></div>` : ""}
    </div>

    <div class="tab-pane" id="tab-roteiro">
      ${post.video ? roteiroHtml : slidesHtml}
    </div>

    <div class="tab-pane" id="tab-legenda">
      <div class="section-title">Legenda completa</div>
      <div class="caption-box">${escapeHtml(captionText)}</div>
      <div class="field" style="margin-top:12px;"><div class="k">CTA principal</div><div class="v"><b>${escapeHtml(post.ctaFinal)}</b></div></div>
    </div>

    <div class="tab-pane" id="tab-stories">
      <div class="section-title">Stories de apoio</div>
      ${storiesHtml || "<i>Sem stories de apoio adicionais para este conteúdo.</i>"}
    </div>

    <div class="tab-pane" id="tab-producao">
      <div class="section-title">Direção de gravação / criativa</div>
      <div class="field"><div class="v">${escapeHtml(post.direcaoGravacao)}</div></div>
    </div>

    <div class="tab-pane" id="tab-checklist">
      <div class="section-title">Checklist de produção</div>
      <div class="checklist">${checklistHtml}</div>
    </div>
  </div>`;
}

// ---------- init ----------
function render(){
  renderMonthNav();
  renderProgress();
  renderMain();
  syncViewButtons();
}
setupToolbar();
render();
initCloudSync();

</script>
